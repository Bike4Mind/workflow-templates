name: secrets-scan

# Reusable secrets scan for Bike4Mind repositories.
#
# Replaces GitHub Advanced Security Secret Protection, which bills $19 per active
# committer per month across every repository it is enabled on. This runs on our own
# runners and covers every repository rather than the handful worth paying for.
#
# Call it from a repository like this:
#
#   jobs:
#     secrets:
#       uses: Bike4Mind/workflow-templates/.github/workflows/secrets-scan.yml@v1
#
# Then add the resulting "secrets-scan / scan" check as a required status check.
#
# What this does NOT replace: GHAS push protection blocked a secret at `git push`,
# before it reached GitHub. This runs after the commit exists, so every finding here
# means ROTATING the credential, not just rewriting the commit.

on:
  workflow_call:
    inputs:
      runner-label:
        description: Runner label. Defaults to the caller's RUNNER_LABEL variable.
        required: false
        type: string
        default: ''
      scan-mode:
        description: '"diff" (default) scans only what the PR adds; "history" scans everything.'
        required: false
        type: string
        default: diff
      base-ref:
        description: Base commit for diff mode. Required for non-pull_request events.
        required: false
        type: string
        default: ''
      config-path:
        description: >
          gitleaks config. Defaults to the caller's .gitleaks.toml if present,
          otherwise the org default bundled with the action.
        required: false
        type: string
        default: ''
      run-trufflehog:
        description: Also run trufflehog with live-credential verification.
        required: false
        type: boolean
        default: true
      fail-on-findings:
        description: Fail the job on any finding. Set false to report only.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 is required. Diff mode walks BASE..HEAD and history mode walks
      # everything; a shallow clone silently scans a truncated range and reports clean.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: Bike4Mind/workflow-templates/.github/actions/secrets-scan@v1
        with:
          scan-mode: ${{ inputs.scan-mode }}
          base-ref: ${{ inputs.base-ref }}
          config-path: ${{ inputs.config-path }}
          run-trufflehog: ${{ inputs.run-trufflehog }}
          fail-on-findings: ${{ inputs.fail-on-findings }}
