name: secrets-scan

# Reusable secrets scan for Bike4Mind repositories.
#
# Replaces GitHub Advanced Security Secret Protection, which bills $19 per active
# committer per month across every repository it is enabled on. This runs on our own
# runners and covers every repository rather than the handful worth paying for.
#
# Call it from a repository like this:
#
#   jobs:
#     secrets:
#       uses: Bike4Mind/workflow-templates/.github/workflows/secrets-scan.yml@v1
#
# Then add the resulting "secrets-scan / scan" check as a required status check.
#
# What this does NOT replace: GHAS push protection blocked a secret at `git push`,
# before it reached GitHub. This runs after the commit exists, so every finding here
# means ROTATING the credential, not just rewriting the commit.

on:
  workflow_call:
    inputs:
      runner-label:
        description: >
          Escape hatch for a single repository. Leave unset and control the fleet
          through the SECRETS_SCAN_RUNNER_LABEL variable instead.
        required: false
        type: string
        default: ''
      scan-mode:
        description: '"diff" (default) scans only what the PR adds; "history" scans everything.'
        required: false
        type: string
        default: diff
      base-ref:
        description: Base commit for diff mode. Required for non-pull_request events.
        required: false
        type: string
        default: ''
      config-path:
        description: >
          gitleaks config. Defaults to the caller's .gitleaks.toml if present,
          otherwise the org default bundled with the action.
        required: false
        type: string
        default: ''
      run-trufflehog:
        description: Also run trufflehog with live-credential verification.
        required: false
        type: boolean
        default: true
      fail-on-findings:
        description: Fail the job on any finding. Set false to report only.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scan:
    name: scan
    # Precedence, most specific first:
    #   1. the runner-label input, for one repository that genuinely differs
    #   2. SECRETS_SCAN_RUNNER_LABEL, set once at org level, so retargeting the whole
    #      fleet is one variable edit rather than a commit in every repository
    #   3. the repo's own RUNNER_LABEL, so a repo with no opinion follows its own CI
    #   4. ubuntu-latest
    #
    # `vars` inside a called reusable workflow resolves against the CALLING repository
    # and its organization, not against workflow-templates, so an org variable reaches
    # every consumer and any single repo can still override it with a repo variable of
    # the same name.
    #
    # Deliberately not defaulting to RUNNER_LABEL alone: repos point that at their
    # build tier, and optihashi's is b4m-deployer-heavy. No heavy runner is kept warm,
    # so a scan that is one curl and two short CLI runs would cold-start an instance
    # on every pull request and contend with builds that need those machines.
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || vars.SECRETS_SCAN_RUNNER_LABEL || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 is required. Diff mode walks BASE..HEAD and history mode walks
      # everything; a shallow clone silently scans a truncated range and reports clean.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The action is loaded at THIS workflow's own ref rather than a fixed tag.
      #
      # A hardcoded `@v1` on the line below would mean the workflow and the action it
      # runs are versioned independently: calling the workflow at @main would still
      # run the v1 action, and every change here would need the v1 tag moved in
      # lockstep. `v1` is already consumed in production by nexus for sst-deploy, so
      # retagging it to ship a secrets-scan change would drag unrelated workflows
      # along with it.
      #
      # `job.workflow_ref` is the full ref of the workflow file defining this job, so
      # inside a called reusable workflow it points at THIS file, not the caller's.
      # Format: owner/repo/.github/workflows/name.yml@refs/heads/branch
      - name: Resolve this workflow's own ref
        id: self
        run: |
          set -euo pipefail
          full='${{ job.workflow_ref }}'
          echo "job.workflow_ref = $full"
          repo="${full%%/.github/*}"
          ref="${full##*@}"
          if [ -z "$repo" ] || [ -z "$ref" ] || [ "$repo" = "$full" ]; then
            echo "::error::could not parse job.workflow_ref: $full"
            exit 1
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Into a subdirectory of the caller's workspace. Both scanners walk git history
      # rather than the working tree, so this checkout is never itself scanned.
      - name: Check out the scanning action at that ref
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ steps.self.outputs.ref }}
          path: .secrets-scan-action

      - name: Scan for secrets
        uses: ./.secrets-scan-action/.github/actions/secrets-scan
        with:
          scan-mode: ${{ inputs.scan-mode }}
          base-ref: ${{ inputs.base-ref }}
          config-path: ${{ inputs.config-path }}
          run-trufflehog: ${{ inputs.run-trufflehog }}
          fail-on-findings: ${{ inputs.fail-on-findings }}
