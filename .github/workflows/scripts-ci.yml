name: scripts-ci

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/actions/check-overlay-deps/**'
      - '.github/actions/secrets-scan/**'
      # Every workflow file, so a new reusable cannot land unvalidated. secrets-sweep
      # was opened with zero checks reported because nothing here matched it.
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run compute-next-semver tests
        run: bash scripts/tests/compute-next-semver.test.sh

  test-check-overlay-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      # typescript is a TEST-ONLY dependency here. The action itself never installs it -
      # it borrows the host tree's copy, so consumers gain no dependency.
      - name: Install the test-only compiler
        working-directory: .github/actions/check-overlay-deps
        run: npm install --no-save --no-audit --no-fund typescript@5.9.3
      - name: Run unit tests
        working-directory: .github/actions/check-overlay-deps
        run: node --test lib.test.mjs

  test-secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # The self-test needs a real gitleaks. Pinned to the same version the action
      # installs, because rule regexes and the builtin charset differ across versions
      # and a self-test passing on a different binary proves nothing about the action.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Self-test the org default gitleaks config
        env:
          GITLEAKS_REQUIRED: '1'
        run: sh .github/actions/secrets-scan/gitleaks-config-selftest.sh
      - name: Test that the self-test actually rejects broken configs
        run: sh .github/actions/secrets-scan/gitleaks-config-selftest.test.sh
      # Parses every workflow and action file, and additionally extracts each `run:`
      # script and syntax-checks it. A block scalar that swallowed a heredoc, or an
      # indented heredoc terminator, parses as valid YAML and fails only at runtime.
      - name: Validate all action and workflow YAML, and every run script
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, subprocess, sys, tempfile, os, yaml

          failed = []
          files = sorted(glob.glob('.github/workflows/*.yml') + glob.glob('.github/actions/*/action.yml'))
          for path in files:
              doc = yaml.safe_load(open(path))
              steps = []
              if 'jobs' in doc:
                  for job in doc['jobs'].values():
                      steps += job.get('steps') or []
              elif 'runs' in doc:
                  steps += doc['runs'].get('steps') or []
              for i, st in enumerate(steps):
                  script = st.get('run')
                  if not script:
                      continue
                  shell = 'sh' if st.get('shell') == 'sh' else 'bash'
                  with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False) as fh:
                      fh.write(script)
                      tmp = fh.name
                  res = subprocess.run([shell, '-n', tmp], capture_output=True, text=True)
                  os.unlink(tmp)
                  if res.returncode != 0:
                      failed.append(f"{path} step {i} ({st.get('name', 'unnamed')}): {res.stderr.strip()}")
              print(f'ok: {path}')
          if failed:
              print('\nFAILED:')
              for f in failed:
                  print('  ' + f)
              sys.exit(1)
          print(f'\n{len(files)} file(s) parsed, every run script syntax-checked')
          PY
