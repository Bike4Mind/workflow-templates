name: secrets-sweep

# Nightly full-history secret sweep across every repository in the org.
#
# The PR check in secrets-scan.yml only looks at what a PR adds, so it cannot see a
# secret that reached main before the check existed, or one pushed directly to a
# branch. This is the safety net for both, and it is the piece that makes retiring
# GitHub Advanced Security defensible: GHAS scanned full history continuously.
#
# Reporting goes to ONE tracking issue in this repository, rewritten on every run, so
# the issue always reflects current state rather than accumulating stale findings.
# Secret VALUES are never written to it - only rule, file, line and commit.

on:
  schedule:
    # 18:10 UTC, early morning in GMT+8. Off the hour on purpose: scheduled workflows
    # queue behind everyone else's on-the-hour crons.
    #
    # A scheduled run does not set the dry-run input, so it takes the live path and
    # writes the tracking issue. That is intended, and it is only enabled now because
    # manual runs proved it: 23 repositories, all scanning, one known finding source.
    - cron: '10 18 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Scan and summarize, but do not create or update the tracking issue.
        type: boolean
        default: true
      repo-filter:
        description: Optional substring; only repositories whose name contains it are scanned.
        type: string
        default: ''
      include-forks:
        description: >
          Also scan forks. Off by default: a fork's history belongs to upstream, we
          cannot rewrite it, and the findings are not ours to rotate.
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: secrets-sweep
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
      count: ${{ steps.list.outputs.count }}
    steps:
      # The app has administration:write among other things, which is far more than a
      # scanner has any business holding. create-github-app-token narrows the minted
      # installation token to exactly what this needs, so a compromised runner in this
      # job cannot write to anything.
      - name: Mint a read-only installation token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NEXUS_BOT_APP_ID }}
          private-key: ${{ secrets.NEXUS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-metadata: read

      - name: List repositories to scan
        id: list
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          FILTER: ${{ inputs.repo-filter }}
          INCLUDE_FORKS: ${{ inputs.include-forks }}
        run: |
          set -euo pipefail
          # Archived repositories are excluded: nothing can be pushed to them, so a
          # finding there is history we cannot act on through this channel anyway.
          gh repo list "${{ github.repository_owner }}" --limit 500 --no-archived \
            --json name,isArchived,isFork,visibility > repos.json
          repos=$(python3 -c "
          import json, os
          f = os.environ.get('FILTER', '')
          forks = os.environ.get('INCLUDE_FORKS') == 'true'
          repos = [r for r in json.load(open('repos.json')) if not r['isArchived']]
          skipped = [r['name'] for r in repos if r['isFork'] and not forks]
          if skipped:
              import sys
              print('Skipping forks: ' + ', '.join(sorted(skipped)), file=sys.stderr)
          names = [r['name'] for r in repos if forks or not r['isFork']]
          if f:
              names = [n for n in names if f in n]
          print(json.dumps(sorted(names)))
          ")
          count=$(python3 -c "import json,sys; print(len(json.loads(sys.argv[1])))" "$repos")
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Scanning $count repositories"

  sweep:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      # One repository's scan failing must not cancel the other twenty-two. A repo
      # that errors is reported as errored rather than silently dropped.
      fail-fast: false
      max-parallel: 6
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.repos) }}
    steps:
      - name: Mint a read-only installation token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NEXUS_BOT_APP_ID }}
          private-key: ${{ secrets.NEXUS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-metadata: read

      # Order matters. The target repo goes to the workspace ROOT, because the action
      # scans the current directory and `working-directory` is not honored on a
      # `uses:` step. The action is checked out into a subdirectory AFTERWARDS: a
      # root checkout cleans the workspace, so doing it the other way round deletes
      # the action before it can run.
      #
      # fetch-depth: 0 is the whole point of this workflow. A shallow clone would scan
      # the tip only and report clean while history holds the leak.
      - name: Check out ${{ matrix.repo }} with full history
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0

      - name: Check out the scanning action
        uses: actions/checkout@v6
        with:
          path: .sweep-action

      - name: Scan full history
        id: scan
        continue-on-error: true
        uses: ./.sweep-action/.github/actions/secrets-scan
        with:
          scan-mode: history
          # Reporting only. A sweep that fails the job would just turn the schedule
          # red every night; the tracking issue is the signal.
          fail-on-findings: 'false'

      - name: Record results
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results
          python3 -c "
          import json, os, sys
          json.dump({
              'repo': os.environ['REPO'],
              'gitleaks': os.environ.get('GITLEAKS') or '0',
              'trufflehog_verified': os.environ.get('TRUFFLEHOG') or '0',
              'outcome': os.environ['OUTCOME'],
          }, open('results/' + os.environ['REPO'] + '.json', 'w'))
          "
        env:
          REPO: ${{ matrix.repo }}
          GITLEAKS: ${{ steps.scan.outputs.gitleaks-findings }}
          TRUFFLEHOG: ${{ steps.scan.outputs.trufflehog-verified }}
          OUTCOME: ${{ steps.scan.outcome }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ matrix.repo }}
          path: results/
          retention-days: 7

  report:
    needs: [discover, sweep]
    # always(): the whole point is to report when something went wrong too. A sweep
    # job that errored is a repository we did NOT scan, which is worse news than a
    # finding, and it must not be swallowed by a skipped report job.
    if: always() && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: sweep-*
          path: results
          merge-multiple: true

      - name: Build the report
        id: report
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os

          rows, failed = [], []
          for path in sorted(glob.glob('results/*.json')):
              d = json.load(open(path))
              gl = int(d.get('gitleaks') or 0)
              th = int(d.get('trufflehog_verified') or 0)
              if d.get('outcome') not in ('success',):
                  failed.append(d['repo'])
              if gl or th:
                  rows.append((d['repo'], gl, th))

          lines = []
          if failed:
              lines.append('### Repositories that did not scan')
              lines.append('')
              lines.append('These were NOT checked. Treat as unknown, not clean.')
              lines.append('')
              for r in sorted(failed):
                  lines.append(f'- `{r}`')
              lines.append('')

          if rows:
              lines.append('### Findings')
              lines.append('')
              lines.append('| Repository | gitleaks | trufflehog verified live |')
              lines.append('|---|---|---|')
              for repo, gl, th in sorted(rows, key=lambda r: (-r[2], -r[1], r[0])):
                  lines.append(f'| `{repo}` | {gl} | {th} |')
              lines.append('')
              lines.append('A trufflehog verified-live count above zero means the credential still '
                           'works right now. Rotate it. Removing the commit does not revoke a key.')
              lines.append('')
              lines.append('Secret values are deliberately absent from this issue. Open the workflow '
                           'run for the file and line of each finding.')

          body = '\n'.join(lines)
          run_url = f"{os.environ['SERVER']}/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"
          if body:
              body += f'\n\nSweep run: {run_url}'

          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'clean={"false" if body else "true"}\n')
          open('report.md', 'w').write(body or 'No findings.')
          print(body or 'No findings.')
          PY
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}

      - name: Create or update the tracking issue
        if: inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN: ${{ steps.report.outputs.clean }}
          TITLE: 'Secrets sweep: open findings'
        run: |
          set -euo pipefail
          # One issue, rewritten every run, so it always reflects current state instead
          # of accumulating findings that were fixed weeks ago.
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" \
                  --json number,title -q "[.[] | select(.title == env.TITLE)][0].number // empty")
          if [ "$CLEAN" = "true" ]; then
            if [ -n "$num" ]; then
              gh issue close "$num" --repo "$GITHUB_REPOSITORY" \
                --comment "Sweep is clean as of run ${{ github.run_id }}. Closing."
              echo "Closed #$num - nothing outstanding."
            else
              echo "Clean, and no open issue to close."
            fi
            exit 0
          fi
          if [ -n "$num" ]; then
            gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --body-file report.md
            echo "Updated #$num"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body-file report.md --assignee poysama
            echo "Opened a new tracking issue"
          fi

      - name: Job summary
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"
